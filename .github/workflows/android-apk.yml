name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

# Precisa de contents: write para publicar a release com o APK.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: bun install
      # GATE: os testes incluem capacitor-config.test.ts, que falha se a WebView
      # apontar para outra URL que não o domínio publicado (a preview retorna 403).
      - run: bun run test
      # GATE: o domínio publicado precisa responder 200, senão todo APK novo
      # sairia quebrado igual à última vez (403 no aparelho).
      - name: Verificar app publicado responde 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -A "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36" https://ctlrevenda.lovable.app/)
          echo "ctlrevenda.lovable.app → $code"
          test "$code" = "200"
      - run: bunx cap add android
      - name: Ícone, TV (Android TV / Fire TV) e conexões http
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:usesCleartextTraffic="true" android:banner="@mipmap/ic_launcher"|' $M
          sed -i 's|<category android:name="android.intent.category.LAUNCHER" />|<category android:name="android.intent.category.LAUNCHER" /><category android:name="android.intent.category.LEANBACK_LAUNCHER" />|' $M
          sed -i 's|</manifest>|<uses-feature android:name="android.software.leanback" android:required="false" /><uses-feature android:name="android.hardware.touchscreen" android:required="false" /></manifest>|' $M
          sed -i 's|<activity|<activity android:screenOrientation="fullUser"|' $M
          bun add -d @capacitor/assets
          mkdir -p assets && cp public/favicon.png assets/icon.png
          curl -sL "$(node -e "console.log('https://ctlrevenda.lovable.app'+require('./src/assets/logo.jpg.asset.json').url)")" -o assets/icon.png || true
          bunx capacitor-assets generate --android --iconBackgroundColor '#020617' || true
      # TELA CHEIA: esconde a barra de status (topo) e a de navegação (baixo);
      # o cliente desliza da borda para vê-las por um instante.
      - name: Tela cheia (sem barras do celular)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java)
          cat > "$F" <<'EOF'
          package br.com.ctl.p2prevenda;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              private void hideBars() {
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.hide(WindowInsetsCompat.Type.systemBars());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              }
          }
          EOF
          sed -i 's/^          //' "$F"
          cat "$F"
      - run: bunx cap sync android
      # Número da build = versionCode, para o app saber se existe versão nova.
      - name: Versão do APK
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      # ASSINATURA FIXA: sem a mesma chave em toda build, o Android recusa
      # instalar a atualização por cima e o cliente teria que desinstalar.
      - name: Assinar com a chave fixa
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS_B64"
          echo "$KS_B64" | base64 -d > ks.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias ctl android/app/build/outputs/apk/debug/app-debug.apk
          $BT/apksigner verify android/app/build/outputs/apk/debug/app-debug.apk
          rm ks.p12
      - uses: actions/upload-artifact@v4
        with:
          name: CTL-P2P-REVENDA-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # RELEASE SEMPRE ATUALIZADA: o artifact do Actions expira e exige login
        # para baixar; a release dá link público estável
        # (releases/latest/download/...) que o painel e o WhatsApp usam.
        # Upload com --clobber troca o binário SEM janela sem release.
      - name: Publicar release latest com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ctlp2p-revenda.apk
          echo '{"build": ${{ github.run_number }}}' > version.json
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ctlp2p-revenda.apk version.json --clobber
            gh release edit latest --latest --title "CTL P2P REVENDA — build ${{ github.run_number }}" --notes "Build automático do workflow android-apk (commit ${{ github.sha }})."
          else
            gh release create latest ctlp2p-revenda.apk version.json \
              --latest \
              --title "CTL P2P REVENDA — build ${{ github.run_number }}" \
              --notes "Build automático do workflow android-apk (commit ${{ github.sha }})."
          fi
